<!DOCTYPE html>
<html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#10131b"><title>Wings — Soundboard</title><link rel="stylesheet" href="style.css"></head>
<body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="app">
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">W</span><span>WINGS<span class="brand-sub">SOUNDBOARD</span></span></a><span class="live"><i></i> AUDIO LIBRARY</span></header>
<section class="hero"><div class="eyebrow"><span></span> YOUR PERSONAL SOUND COLLECTION</div><h1>Bring your sounds<br><em>to life.</em></h1><p>აირჩიე ხმა და დაუკარი ერთი დაჭერით.</p><div class="hero-stats"><div><strong id="soundCount">15</strong><span>ხმოვანი ფაილი</span></div><div class="stat-divider"></div><div><strong id="playingCount">0</strong><span>ახლა უკრავს</span></div></div></section>
<section class="library"><div class="section-heading"><div><div class="eyebrow">THE COLLECTION</div><h2>ხმების ბიბლიოთეკა</h2></div><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="მოძებნე ხმა..."></label></div><div class="toolbar"><span id="resultsLabel">ყველა ხმა</span><button class="stop-all" id="stopAll" type="button">■ <span>ყველას გაჩერება</span></button></div><div class="sound-grid" id="soundGrid"></div><div class="empty" id="emptyState" hidden>ამ სახელით ხმა ვერ მოიძებნა.</div></section><footer><span>WINGS SOUNDBOARD</span><span>Made for your sounds ✦</span></footer></main><script src="script.js"></script></body></html>
